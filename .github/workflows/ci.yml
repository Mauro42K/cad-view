name: Downstream validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: upstream-supported-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm docs:build
      - run: pnpm --filter @mlightcad/cad-viewer-example exec playwright install-deps chromium
      - run: pnpm --filter @mlightcad/cad-viewer-example test:e2e
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
