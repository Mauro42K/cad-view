name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.4
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e289664e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@mlightcad'

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Verify package.json versions match overrides
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm sync:versions:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Build projects
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build

      - name: Run tests
        run: pnpm test

      # Use system Google Chrome (preinstalled on ubuntu-latest) via channel "chrome".
      # Avoids playwright install chromium, which often hangs at zip extraction on CI.
      - name: Install Playwright system dependencies
        run: pnpm --filter @mlightcad/cad-viewer-example exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @mlightcad/cad-viewer-example test:e2e
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-artifacts
          path: |
            packages/cad-viewer-example/playwright-report/
            packages/cad-viewer-example/test-results/
          if-no-files-found: ignore

      - name: Build docs
        run: pnpm docs:build

      - name: Pre-serve
        run: pnpm pre-serve

      - name: Export self-contained HTML demo
        if: github.ref == 'refs/heads/main'
        run: node packages/examples/exportDemoHtml.js
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome

      # Keep release/pages-only actions out of this job so PR builds do not
      # download softprops/action-gh-release or upload-pages-artifact (GitHub
      # fetches every uses: action at job setup, even when step if: is false).
      - name: Upload pages source
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages-source
          path: packages/examples/public/
          retention-days: 1

  # Authenticates via npm Trusted Publishing (OIDC); no NPM_TOKEN needed.
  # Configure each package on npmjs.com → Settings → Trusted publishing:
  #   Provider: GitHub Actions
  #   Repository: mlightcad/cad-viewer
  #   Workflow filename: ci.yml
  #   Environment: release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.4
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e289664e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@mlightcad'

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build projects
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build

      - name: Publish packages to npm
        run: |
          npm --version
          # setup-node writes an empty _authToken line that blocks OIDC fallback
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi
          pnpm publish:viewer

      - name: Create github release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

  upload-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download pages source
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pages-source
          path: packages/examples/public/

      - name: Upload github pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: './packages/examples/public/'

  deploy-pages:
    needs: upload-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
