name: Upstream synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: upstream-synchronization
  cancel-in-progress: false

permissions:
  contents: read

env:
  SYNC_BRANCH: chore/upstream-sync
  UPSTREAM_REPOSITORY: mlightcad/cad-viewer
  VERCEL_PROJECT_ID: prj_rTscpKmChu5EXZKBXcCh6mzC01Q2
  VERCEL_TEAM_ID: team_59ltVAfw1BgF3dX6dn1pT2OF
  VERCEL_TEAM_SLUG: mauricios-projects-e89a04cd
  DOWNSTREAM_ALLOWLIST: |-
    .github/workflows/ci.yml
    .github/workflows/upstream-sync.yml
    AGENTS.md
    docs/DEPENDENCY_POLICY.md
    docs/DOWNSTREAM_MAINTENANCE.md
    vercel.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout downstream history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure local Git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Fetch upstream and downstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Validate clean upstream baseline
        id: upstream_health
        run: |
          set -o pipefail
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          health_dir="$RUNNER_TEMP/cad-view-upstream-health"
          failed_command="git worktree add --detach ${health_dir} ${upstream_sha}"
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$health_dir" >/dev/null 2>&1 || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              {
                echo '## Clean upstream unhealthy'
                echo
                echo "- Upstream SHA: \`${upstream_sha}\`"
                echo "- Failed command: \`${failed_command}\`"
                echo '- Reason: clean upstream did not pass its supported validation baseline.'
                echo '- Downstream main was not modified and no synchronization branch or PR was published.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          git worktree add --detach "$health_dir" "$upstream_sha"
          cd "$health_dir"
          run_check() {
            failed_command="$*"
            "$@"
            failed_command=''
          }
          run_check corepack enable
          run_check corepack prepare pnpm@10.33.4 --activate
          run_check pnpm install --frozen-lockfile
          run_check pnpm lint
          export NODE_OPTIONS="--max-old-space-size=4096"
          run_check pnpm build
          run_check pnpm test

      - name: Check upstream/downstream ancestry
        id: topology
        env:
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          merge_base="$(git merge-base origin/main upstream/main || true)"
          if [ -z "$merge_base" ]; then
            {
              echo '## Healthy upstream — initial parity reconciliation required'
              echo
              echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
              echo '- Clean upstream passed its own validation baseline.'
              echo '- Downstream and upstream have no merge base.'
              echo '- No synchronization branch or PR was published; downstream main was not modified.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'common_ancestry=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge_base=${merge_base}" >> "$GITHUB_OUTPUT"
          echo 'common_ancestry=true' >> "$GITHUB_OUTPUT"

      - name: Rebuild synchronization candidate from current main
        id: reconcile
        if: steps.topology.outputs.common_ancestry == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null 2>&1; then
            git fetch --prune origin "${SYNC_BRANCH}"
          fi
          git switch --detach origin/main
          git branch -f "${SYNC_BRANCH}" origin/main
          git switch "${SYNC_BRANCH}"
          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            {
              echo '## Upstream synchronization blocked'
              echo
              echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
              echo '- Reason: reconciliation conflict after clean upstream passed health validation.'
              echo '- Downstream main was not modified and no candidate was pushed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git diff --quiet origin/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_files="$(git diff --name-only upstream/main HEAD | sort)"
          if [ "${actual_files}" != "${DOWNSTREAM_ALLOWLIST}" ]; then
            {
              echo '## Synchronization candidate blocked'
              echo
              echo '- Reason: candidate diff is outside the authorized downstream allowlist.'
              echo '### Actual files'
              printf '%s\n' "${actual_files}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git diff --check

      - name: Validate reconciled synchronization candidate
        if: steps.reconcile.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          set -o pipefail
          failed_command=''
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              {
                echo '## Synchronization candidate blocked'
                echo
                echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
                echo "- Failed command: \`${failed_command}\`"
                echo '- Reason: the reconciled downstream candidate did not pass validation.'
                echo '- Downstream main was not modified and the candidate was not pushed.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          }
          trap on_exit EXIT
          corepack enable
          run_check() {
            failed_command="$*"
            "$@"
            failed_command=''
          }
          run_check corepack prepare pnpm@10.33.4 --activate
          run_check pnpm install --frozen-lockfile
          run_check pnpm lint
          export NODE_OPTIONS="--max-old-space-size=4096"
          run_check pnpm build
          run_check pnpm test

      - name: Push synchronization branch
        if: steps.reconcile.outputs.changed == 'true'
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_PUSH_TOKEN}" ]; then
            echo 'UPSTREAM_SYNC_TOKEN repository secret is required to publish workflow-file changes.' >&2
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}"; then
            lease="$(git rev-parse "refs/remotes/origin/${SYNC_BRANCH}")"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${SYNC_PUSH_TOKEN}" | base64 -w0)" push --force-with-lease="refs/heads/${SYNC_BRANCH}:${lease}" origin "${SYNC_BRANCH}:${SYNC_BRANCH}"
          else
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${SYNC_PUSH_TOKEN}" | base64 -w0)" push origin "${SYNC_BRANCH}:${SYNC_BRANCH}"
          fi

      - name: Create or update synchronization PR
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          title="chore: synchronize upstream main ${UPSTREAM_SHA}"
          body="Automated upstream synchronization from mlightcad/cad-viewer. Source SHA: ${UPSTREAM_SHA}. Clean upstream health, ancestry, exact allowlist parity, and candidate validation passed. This PR is eligible for automatic merge only after all required gates pass."
          existing="$(gh pr list --base main --head "${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          pr_created=false
          if [ -n "$existing" ]; then
            pr_number="$existing"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              -f title="${title}" -f body="${body}" >/dev/null
            echo "Updated synchronization PR #${pr_number}."
          else
            response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f base=main -f head="${SYNC_BRANCH}" -f title="${title}" -f body="${body}")"
            pr_number="$(jq -r '.number' <<<"${response}")"
            pr_created=true
            echo "Created synchronization PR #${pr_number}."
          fi
          expected_head="$(git rev-parse HEAD)"
          expected_base="$(git rev-parse origin/main)"
          required_checks=("build" "Analyze (actions)" "Analyze (javascript-typescript)" "CodeQL" "Vercel Preview Comments")
          check_conclusion() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${expected_head}/check-runs" | jq -r --arg name "$1" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at) | last | (.conclusion // "pending")'
          }
          vercel_state() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${expected_head}/status" --jq '[.statuses[] | select(.context == "Vercel")] | sort_by(.created_at) | last | (.state // "pending")'
          }
          for attempt in $(seq 1 30); do
            pr_state="$(gh pr view "${pr_number}" --json state,headRefOid,baseRefOid,mergeable,mergeStateStatus)"
            head_sha="$(jq -r '.headRefOid' <<<"${pr_state}")"
            base_sha="$(jq -r '.baseRefOid' <<<"${pr_state}")"
            if [ "$(jq -r '.state' <<<"${pr_state}")" != 'OPEN' ] || [ "${head_sha}" != "${expected_head}" ] || [ "${base_sha}" != "${expected_base}" ]; then
              if [ "${pr_created}" = true ] && [ "${attempt}" -lt 7 ]; then
                echo "GitHub is still materializing the new PR; retrying (${attempt}/6)."
                sleep 5
                continue
              fi
              echo 'PR head/base/state changed unexpectedly; refusing automatic merge.' >&2
              exit 1
            fi
            git fetch --prune upstream main
            [ "$(git rev-parse upstream/main)" = "${UPSTREAM_SHA}" ] || { echo 'Upstream advanced; refusing automatic merge.' >&2; exit 1; }
            git merge-base --is-ancestor "${UPSTREAM_SHA}" "${expected_head}"
            actual_files="$(git diff --name-only "${UPSTREAM_SHA}" "${expected_head}" | sort)"
            [ "${actual_files}" = "${DOWNSTREAM_ALLOWLIST}" ] || { echo 'Candidate diff escaped the allowlist; refusing automatic merge.' >&2; exit 1; }
            all_passed=true
            for check in "${required_checks[@]}"; do
              conclusion="$(check_conclusion "${check}")"
              [ "${conclusion}" = 'success' ] || all_passed=false
            done
            [ "$(vercel_state)" = 'success' ] || all_passed=false
            [ "$(jq -r '.mergeable' <<<"${pr_state}")" = 'MERGEABLE' ] || all_passed=false
            [ "$(jq -r '.mergeStateStatus' <<<"${pr_state}")" = 'CLEAN' ] || all_passed=false
            if [ "${all_passed}" = true ]; then
              merged="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" -f merge_method=merge -f sha="${expected_head}" -f commit_title="${title}" --jq '.merged')"
              [ "${merged}" = true ] || { echo 'GitHub did not merge the synchronization PR.' >&2; exit 1; }
              merge_sha="$(gh pr view "${pr_number}" --json mergeCommit --jq '.mergeCommit.oid')"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SYNC_BRANCH}"
              git fetch --prune origin main
              git merge-base --is-ancestor "${merge_sha}" origin/main
              git merge-base --is-ancestor "${UPSTREAM_SHA}" origin/main
              if [ -z "${VERCEL_TOKEN}" ]; then
                echo 'VERCEL_TOKEN repository secret is required for post-merge Production verification.' >&2
                exit 1
              fi
              production_id=''
              retry_used=false
              for production_attempt in $(seq 1 30); do
                deployments="$(curl --fail --silent --show-error --retry 2 \
                  -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                  "https://api.vercel.com/v13/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=50")"
                production_id="$(jq -r --arg sha "${merge_sha}" '[.deployments[] | select(.target == "production" and .meta.githubCommitSha == $sha)] | sort_by(.created) | last | (.id // "")' <<<"${deployments}")"
                if [ -z "${production_id}" ]; then
                  sleep 20
                  continue
                fi
                production="$(curl --fail --silent --show-error --retry 2 \
                  -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                  "https://api.vercel.com/v13/deployments/${production_id}?teamId=${VERCEL_TEAM_ID}")"
                production_state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"${production}")"
                if [ "${production_state}" = 'READY' ]; then
                  break
                fi
                if [ "${production_state}" = 'ERROR' ]; then
                  detail_file="${RUNNER_TEMP}/vercel-production-detail.json"
                  log_file="${RUNNER_TEMP}/vercel-production-events.log"
                  printf '%s' "${production}" > "${detail_file}"
                  curl --fail --silent --show-error --retry 2 \
                    -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                    "https://api.vercel.com/v3/deployments/${production_id}/events?teamId=${VERCEL_TEAM_ID}&limit=200" > "${log_file}" || true
                  if [ "${retry_used}" = false ] \
                    && jq -e '.errorCode == "package_not_found"' "${detail_file}" >/dev/null \
                    && grep -Fq '@vue/language-core' "${log_file}" \
                    && grep -Fq 'unplugin-dts' "${log_file}"; then
                    retry_used=true
                    git switch --detach origin/main
                    npx --yes vercel@54.21.1 deploy --prod --force --yes \
                      --project "${VERCEL_PROJECT_ID}" --scope "${VERCEL_TEAM_SLUG}" \
                      --token "${VERCEL_TOKEN}" --meta "githubCommitSha=${merge_sha}" >/dev/null
                    production_id=''
                    continue
                  fi
                  echo 'Production failed with a non-retriable error or the single clean retry already ran.' >&2
                  exit 1
                fi
                sleep 20
              done
              final_production="$(curl --fail --silent --show-error --retry 2 \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v13/deployments/${production_id}?teamId=${VERCEL_TEAM_ID}")"
              if [ "$(jq -r '.readyState // .state // "UNKNOWN"' <<<"${final_production}")" != 'READY' ]; then
                echo 'Production did not reach READY for the exact merged main SHA within the timeout.' >&2
                exit 1
              fi
              {
                echo '## Automatic upstream synchronization merged'
                echo
                echo "- PR: #${pr_number}"
                echo "- Upstream SHA: `${UPSTREAM_SHA}`"
                echo "- Merge SHA: `${merge_sha}`"
                echo '- Method: normal merge'
                echo '- Branch cleanup: passed'
                echo '- Required candidate, parity, CodeQL, and Vercel gates: passed'
                echo "- Production deployment: \`${production_id}\` READY"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo 'Required gates did not complete within the bounded wait window; no merge performed.' >&2
          exit 1
