name: Upstream synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

env:
  SYNC_BRANCH: chore/upstream-sync
  UPSTREAM_REPOSITORY: mlightcad/cad-viewer

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout downstream history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure local Git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Fetch upstream and downstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Validate clean upstream baseline
        id: upstream_health
        run: |
          set -o pipefail
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          health_dir="$RUNNER_TEMP/cad-view-upstream-health"
          failed_command="git worktree add --detach ${health_dir} ${upstream_sha}"
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$health_dir" >/dev/null 2>&1 || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              {
                echo '## Clean upstream unhealthy'
                echo
                echo "- Upstream SHA: \`${upstream_sha}\`"
                echo "- Failed command: \`${failed_command}\`"
                echo '- Reason: clean upstream did not pass its supported validation baseline.'
                echo '- Downstream main was not modified and no synchronization branch or PR was published.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          git worktree add --detach "$health_dir" "$upstream_sha"
          cd "$health_dir"
          run_check() {
            failed_command="$*"
            "$@"
            failed_command=''
          }
          run_check corepack enable
          run_check corepack prepare pnpm@10.33.4 --activate
          run_check pnpm install --frozen-lockfile
          run_check pnpm lint
          export NODE_OPTIONS="--max-old-space-size=4096"
          run_check pnpm build
          run_check pnpm test

      - name: Check upstream/downstream ancestry
        id: topology
        env:
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          merge_base="$(git merge-base origin/main upstream/main || true)"
          if [ -z "$merge_base" ]; then
            {
              echo '## Healthy upstream — initial parity reconciliation required'
              echo
              echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
              echo '- Clean upstream passed its own validation baseline.'
              echo '- Downstream and upstream have no merge base.'
              echo '- No synchronization branch or PR was published; downstream main was not modified.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'common_ancestry=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge_base=${merge_base}" >> "$GITHUB_OUTPUT"
          echo 'common_ancestry=true' >> "$GITHUB_OUTPUT"

      - name: Rebuild synchronization candidate from current main
        id: reconcile
        if: steps.topology.outputs.common_ancestry == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null 2>&1; then
            git fetch --prune origin "${SYNC_BRANCH}"
          fi
          git switch --detach origin/main
          git branch -f "${SYNC_BRANCH}" origin/main
          git switch "${SYNC_BRANCH}"
          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            {
              echo '## Upstream synchronization blocked'
              echo
              echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
              echo '- Reason: reconciliation conflict after clean upstream passed health validation.'
              echo '- Downstream main was not modified and no candidate was pushed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git diff --quiet origin/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git diff --check

      - name: Validate reconciled synchronization candidate
        if: steps.reconcile.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          set -o pipefail
          failed_command=''
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              {
                echo '## Synchronization candidate blocked'
                echo
                echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
                echo "- Failed command: \`${failed_command}\`"
                echo '- Reason: the reconciled downstream candidate did not pass validation.'
                echo '- Downstream main was not modified and the candidate was not pushed.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          }
          trap on_exit EXIT
          corepack enable
          run_check() {
            failed_command="$*"
            "$@"
            failed_command=''
          }
          run_check corepack prepare pnpm@10.33.4 --activate
          run_check pnpm install --frozen-lockfile
          run_check pnpm lint
          export NODE_OPTIONS="--max-old-space-size=4096"
          run_check pnpm build
          run_check pnpm test

      - name: Push synchronization branch
        if: steps.reconcile.outputs.changed == 'true'
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_PUSH_TOKEN}" ]; then
            echo 'UPSTREAM_SYNC_TOKEN repository secret is required to publish workflow-file changes.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}"; then
            lease="$(git rev-parse "refs/remotes/origin/${SYNC_BRANCH}")"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${SYNC_PUSH_TOKEN}" | base64 -w0)" push --force-with-lease="refs/heads/${SYNC_BRANCH}:${lease}" origin "${SYNC_BRANCH}:${SYNC_BRANCH}"
          else
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${SYNC_PUSH_TOKEN}" | base64 -w0)" push origin "${SYNC_BRANCH}:${SYNC_BRANCH}"
          fi

      - name: Create synchronization PR when absent
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream_health.outputs.upstream_sha }}
        run: |
          existing="$(gh pr list --base main --head "${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Synchronization PR #${existing} already exists."
            exit 0
          fi
          title="chore: synchronize upstream main ${UPSTREAM_SHA}"
          body="Automated upstream synchronization from mlightcad/cad-viewer. Source SHA: ${UPSTREAM_SHA}. Clean upstream health and downstream candidate validation passed. Review before merging."
          set +e
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base=main \
            -f head="${SYNC_BRANCH}" \
            -f title="${title}" \
            -f body="${body}" \
            --jq '.html_url' 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$response"
            exit 0
          fi
          if echo "$response" | grep -Fq 'A pull request already exists'; then
            echo 'Synchronization PR already exists; treating duplicate creation as a normal no-op.'
            exit 0
          fi
          echo "$response" >&2
          exit "$status"
