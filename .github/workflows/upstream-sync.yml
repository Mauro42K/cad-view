name: Upstream synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: chore/upstream-sync
  UPSTREAM_REPOSITORY: mlightcad/cad-viewer

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch upstream and existing sync branch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune origin main
          git fetch --prune upstream main
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null 2>&1; then
            git fetch --prune origin "${SYNC_BRANCH}"
          fi
          git switch --detach origin/main
          git branch -f "${SYNC_BRANCH}" origin/main
          git switch "${SYNC_BRANCH}"

      - name: Merge upstream without rewriting history
        id: reconcile
        run: |
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            {
              echo '## Upstream synchronization blocked'
              echo
              echo "- Upstream SHA: \`$upstream_sha\`"
              echo '- Reason: merge conflict while constructing the synchronization candidate.'
              echo '- Downstream main was not modified.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Upstream merge conflict at $upstream_sha; no branch update was pushed." >&2
            exit 1
          fi
          if git diff --quiet origin/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git diff --check
          git status --short

      - name: Validate synchronization candidate
        if: steps.reconcile.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.reconcile.outputs.upstream_sha }}
        run: |
          set -o pipefail
          failed_command=''
          trap 'status=$?; if [ "$status" -ne 0 ]; then { echo "## Upstream synchronization blocked"; echo; echo "- Upstream SHA: \`$UPSTREAM_SHA\`"; echo "- Failed command: \`$failed_command\`"; echo "- Reason: the clean upstream candidate did not pass the downstream validation baseline."; echo "- Downstream main was not modified."; } >> "$GITHUB_STEP_SUMMARY"; fi; exit "$status"' EXIT
          run_check() {
            failed_command="$*"
            "$@"
            failed_command=''
          }
          corepack enable
          run_check corepack prepare pnpm@10.33.4 --activate
          run_check pnpm install --frozen-lockfile
          run_check pnpm lint
          run_check pnpm test
          run_check pnpm build

      - name: Push synchronization branch
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}"; then
            lease="$(git rev-parse "refs/remotes/origin/${SYNC_BRANCH}")"
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${lease}" origin "${SYNC_BRANCH}:${SYNC_BRANCH}"
          else
            git push origin "${SYNC_BRANCH}:${SYNC_BRANCH}"
          fi

      - name: Create synchronization PR when absent
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.reconcile.outputs.upstream_sha }}
        run: |
          existing="$(gh pr list --base main --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Synchronization PR #${existing} already exists."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${SYNC_BRANCH}" \
            --title "chore: synchronize upstream main ${UPSTREAM_SHA}" \
            --body "Automated upstream synchronization from mlightcad/cad-viewer.\n\nSource SHA: ${UPSTREAM_SHA}\n\nReview the downstream delta and validation before merging."
